name: Capture MiMo RL snapshots

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Capture pages and live API data
        run: node scripts/snapshot.mjs
      - name: Store 90-day download artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimo-rl-${{ github.run_id }}
          path: snapshots/
          retention-days: 90
          if-no-files-found: error
      - name: Configure Cloudflare R2 credentials
        if: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto
      - name: Copy to long-term Cloudflare R2 storage
        if: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: aws s3 sync snapshots/ "s3://${R2_BUCKET}/mimo-rl/" --endpoint-url "$R2_ENDPOINT"
